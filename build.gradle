plugins {
    id 'java-library'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

springBoot {
    mainClass = 'cherry.callgraph.Main'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:unchecked', '-Xlint:deprecation']
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.1.1'
    }
    dependencies {
        dependency 'org.soot-oss:sootup.core:3.0.1'
        dependency 'org.soot-oss:sootup.java.core:3.0.1'
        dependency 'org.soot-oss:sootup.java.bytecode.frontend:3.0.1'
        dependency 'org.soot-oss:sootup.callgraph:3.0.1'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.soot-oss:sootup.core'
    implementation 'org.soot-oss:sootup.java.core'
    implementation 'org.soot-oss:sootup.java.bytecode.frontend'
    implementation 'org.soot-oss:sootup.callgraph'
    implementation 'jakarta.annotation:jakarta.annotation-api'
}

plugins {
    id 'java-library'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

springBoot {
    mainClass = 'cherry.callgraph.Main'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:unchecked', '-Xlint:deprecation']
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.0.5'
    }
    dependencies {
        dependency 'org.soot-oss:sootup.core:2.0.0'
        dependency 'org.soot-oss:sootup.java.core:2.0.0'
        dependency 'org.soot-oss:sootup.java.bytecode.frontend:2.0.0'
        dependency 'org.soot-oss:sootup.callgraph:2.0.0'
        // SootUp 2.0.0 bundles ASM 9.7.1, which can't parse Java 25 class files
        // (major version 69) and silently drops them during analysis.
        dependency 'org.ow2.asm:asm:9.9'
        dependency 'org.ow2.asm:asm-tree:9.9'
        dependency 'org.ow2.asm:asm-commons:9.9'
        dependency 'org.ow2.asm:asm-util:9.9'
        dependency 'org.ow2.asm:asm-analysis:9.9'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.soot-oss:sootup.core'
    implementation 'org.soot-oss:sootup.java.core'
    implementation 'org.soot-oss:sootup.java.bytecode.frontend'
    implementation 'org.soot-oss:sootup.callgraph'
    implementation 'jakarta.annotation:jakarta.annotation-api'
}
